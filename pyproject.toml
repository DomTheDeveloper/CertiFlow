[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "certiflow"
version = "0.2.0"
description = "Proof-carrying data pipeline verification research prototype"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Dominic Dabish"}]
dependencies = []

[project.scripts]
certiflow = "certiflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
